<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка бизнеса: Дамодаран и кейс Anthropic | MBA AlmaU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Верхняя панель управления */
        .hub-header {
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(0, 30, 80, 0.05);
        }

        .hub-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hub-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        /* Переключатель вкладок */
        .tabs-nav {
            display: flex;
            background-color: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            gap: 4px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            color: #475569;
            padding: 10px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #001e50;
            background-color: rgba(255, 255, 255, 0.6);
        }

        .tab-btn.active {
            background-color: #001e50;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 30, 80, 0.2);
        }

        .badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .tab-btn:not(.active) .badge {
            background-color: #e2e8f0;
            color: #334155;
        }

        /* Кнопка возврата к теме */
        .back-link {
            text-decoration: none;
            background-color: #f1f5f9;
            color: #001e50;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            background-color: #001e50;
            color: #ffffff;
            border-color: #001e50;
        }

        /* Контейнер для симуляторов */
        .iframe-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 768px) {
            .hub-header {
                padding: 10px 12px;
                justify-content: center;
            }
            .hub-logo {
                display: none;
            }
            .tabs-nav {
                width: 100%;
                justify-content: space-between;
            }
            .tab-btn {
                flex: 1;
                justify-content: center;
                padding: 8px 10px;
                font-size: 12px;
            }
            .back-link {
                width: 100%;
                text-align: center;
                padding: 7px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <header class="hub-header">
        <div class="hub-left">
            <img src="../pictures/main/pic-gsb-logo.png" 
                 onerror="this.style.display='none';" 
                 alt="AlmaU GSB" class="hub-logo">

            <nav class="tabs-nav" role="tablist">
                <button class="tab-btn active" onclick="switchTab('damodaran', this)">
                    <span>1. Модель Дамодарана (NPV)</span>
                    <span class="badge">База</span>
                </button>
                <button class="tab-btn" onclick="switchTab('anthropic', this)">
                    <span>2. Оценка Anthropic</span>
                    <span class="badge">Кейс ИИ</span>
                </button>
            </nav>
        </div>

        <!-- Если страница темы называется иначе (например, topic1.html), поправьте href ниже -->
        <a href="../topic1.html" class="back-link">← К Теме 1</a>
    </header>

    <main class="iframe-wrapper">
        <!-- Вкладка 1: Дамодаран (грузится сразу) -->
        <iframe id="frame-damodaran" 
                class="active" 
                src="sim-npv-aswath-me.html" 
                title="Симулятор: Модель NPV (Асват Дамодаран)">
        </iframe>

        <!-- Вкладка 2: Anthropic (подгружается при клике, чтобы не нагружать страницу сразу) -->
        <iframe id="frame-anthropic" 
                data-src="sim-antropic.html.html" 
                title="Симулятор: Оценка Anthropic">
        </iframe>
    </main>

    <script>
        function switchTab(tabName, btnElement) {
            // Снимаем активность со всех кнопок и фреймов
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));

            // Активируем выбранную кнопку
            btnElement.classList.add('active');

            // Находим нужный iframe
            const targetFrame = document.getElementById('frame-' + tabName);
            
            // Ленивая загрузка: загружаем src только при первом открытии вкладки
            if (!targetFrame.getAttribute('src') && targetFrame.dataset.src) {
                targetFrame.setAttribute('src', targetFrame.dataset.src);
            }
            
            targetFrame.classList.add('active');
        }
    </script>

</body>
</html>
